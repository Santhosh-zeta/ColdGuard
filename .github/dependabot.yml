version: 2

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

  # npm (mobile app)
  - package-ecosystem: "npm"
    directory: "/mobile_app"
    open-pull-requests-limit: 5
    # Packages managed by the Expo SDK are upgraded together with
    # `npx expo upgrade` (they must stay at the versions the SDK pins, e.g.
    # `react` must match React Native's renderer), so Dependabot must not
    # propose them one by one.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-picker/picker"
      - dependency-name: "jest-expo"
      - dependency-name: "babel-preset-expo"
    groups:
      react-navigation:
        patterns:
          - "@react-navigation/*"
      development-tools:
        dependency-type: "development"
        patterns:
          - "*"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

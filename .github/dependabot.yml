version: 2

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

  # npm (mobile app)
  - package-ecosystem: "npm"
    directory: "/mobile_app"
    open-pull-requests-limit: 5
    groups:
      mobile-framework:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
          - "@react-navigation/*"
      development-tools:
        dependency-type: "development"
        patterns:
          - "*"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
